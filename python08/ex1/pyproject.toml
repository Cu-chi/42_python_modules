[project]
name = "matrix-data-visualization"
version = "0.1.0"
description = "generates visualization of last month temperature at 42 Lyon"
authors = [
    {name = "Ethan Quentin",email = "equentin@student.42lyon.fr"}
]
requires-python = ">=3.10"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "numpy (>=2.2.6,<3.0.0)",
    "pandas (>=2.0.1,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
